<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Chạy local hay sửa code thì đừng để trình duyệt giữ bản cũ: có lần nó dùng
       lại HTML cũ với js mới, giao diện vỡ mà tưởng là lỗi code. -->
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="description" content="Ai Là Triệu Phú — dựng theo format VTV3 bản 2015-2016. Mở bằng trình duyệt, không cần cài gì.">
  <title>Ai Là Triệu Phú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">

  <style>
    /* ======================================================================
       Bảng màu lấy theo trường quay bản 2015-2016: nền xanh mực gần như đen,
       ánh đèn quét từ trên xuống, hộp câu hỏi và đáp án viền xanh sáng, chữ
       phương án màu hổ phách. Chọn thì hổ phách đầy, đúng thì xanh lá.
       ==================================================================== */
    :root {
      color-scheme: dark;

      --ink-900: #01040e;
      --ink-800: #04102b;
      --ink-700: #072047;
      --blue-600: #1b56c4;
      --blue-500: #2f7ae5;
      --blue-400: #5aa6ff;
      --amber-400: #ffb83d;
      --amber-500: #f0961a;
      --amber-600: #b56a09;
      --green-500: #16a34a;
      --green-400: #35d06d;
      --red-500: #d12121;
      --cream: #eef4ff;
      --cream-dim: #9fb4d8;

      /* vệt sáng mỏng vắt ngang nửa trên, làm mặt khối trông như kính bóng */
      --bong: linear-gradient(180deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, .03) 40%, rgba(255, 255, 255, 0) 62%);

      --hex: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
      --hex-sm: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);

      --fx-display: "Anton", "Arial Narrow", Impact, sans-serif;
      --fx-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--fx-body);
      color: var(--cream);
      background:
        radial-gradient(1200px 700px at 50% -16%, rgba(90, 166, 255, .20), transparent 62%),
        radial-gradient(900px 600px at 8% 108%, rgba(27, 86, 196, .16), transparent 60%),
        radial-gradient(900px 600px at 92% 108%, rgba(27, 86, 196, .16), transparent 60%),
        linear-gradient(178deg, var(--ink-800) 0%, var(--ink-900) 60%, #000208 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Hai chùm đèn quét từ nóc trường quay xuống */
    .beams {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
      transform-origin: 50% 0%;
      animation: quetden 34s ease-in-out infinite alternate;
      background: conic-gradient(from 198deg at 50% -10%,
          transparent 0deg, rgba(120, 180, 255, .13) 8deg, transparent 17deg,
          transparent 30deg, rgba(120, 180, 255, .09) 37deg, transparent 46deg,
          transparent 58deg, rgba(120, 180, 255, .12) 65deg, transparent 74deg);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .95), transparent 72%);
    }

    @keyframes quetden {
      from { transform: rotate(-2.2deg) scale(1.04); }
      to   { transform: rotate(2.2deg)  scale(1.04); }
    }

    /* ánh hắt lên từ sàn trường quay */
    .floor {
      position: fixed; left: 0; right: 0; bottom: 0; height: 42vh;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(70% 100% at 50% 118%, rgba(47, 122, 229, .26), transparent 70%),
        radial-gradient(40% 80% at 50% 130%, rgba(255, 184, 61, .10), transparent 70%);
    }

    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      box-shadow: inset 0 0 240px 70px rgba(0, 1, 6, .8);
    }

    /* ====================================================================== */

    .screen { position: relative; z-index: 1; display: none; min-height: 100vh; min-height: 100dvh; }
    .screen.on { display: block; }

    /* ===== Màn hình chào ================================================= */

    #s-intro, #s-ready, #s-end {
      display: none;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
    }
    #s-intro.on, #s-ready.on, #s-end.on { display: grid; }

    .logo {
      font-family: var(--fx-display);
      line-height: .92;
      letter-spacing: .015em;
      font-size: clamp(42px, 10.5vw, 104px);
      margin: 0;
      text-wrap: balance;
      background: linear-gradient(180deg, #fff8e3 0%, var(--amber-400) 44%, var(--amber-600) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 rgba(90, 50, 4, .55)) drop-shadow(0 14px 32px rgba(0, 0, 0, .6));
    }

    .sub { margin: 18px auto 0; max-width: 46ch; color: var(--cream-dim); line-height: 1.7; font-size: 15.5px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 34px; }

    .btn {
      font-family: var(--fx-body);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .01em;
      color: #06122e;
      background: linear-gradient(180deg, #ffd988 0%, var(--amber-400) 40%, var(--amber-500) 100%);
      border: 0;
      border-radius: 999px;
      padding: 14px 30px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(120, 70, 6, .6), 0 12px 26px rgba(0, 0, 0, .5);
      transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(120, 70, 6, .6), 0 6px 14px rgba(0, 0, 0, .5); }

    /* nút trang chủ là thẻ <a>, bỏ gạch chân mặc định của trình duyệt */
    a.btn, a.mini { text-decoration: none; display: inline-flex; align-items: center; }

    .btn.ghost {
      background: transparent;
      color: var(--cream);
      border: 1.5px solid rgba(90, 166, 255, .5);
      box-shadow: none;
    }
    .btn.ghost:hover { background: rgba(47, 122, 229, .14); }
    .btn.ghost:active { transform: translateY(2px); box-shadow: none; }

    .btn:disabled { opacity: .4; cursor: default; filter: none; }

    /* ===== Màn hình chơi ================================================= */

    #s-play.on { display: grid; }
    #s-play {
      grid-template-columns: 1fr 268px;
      gap: 22px;
      max-width: 1240px;
      margin: 0 auto;
      /* chừa chỗ cho hai nút nổi ở góc trên bên phải */
      padding: 56px 20px 26px;
      /* màn hình cao thì dồn cả sân khấu vào giữa cho cân, đỡ trống phía dưới */
      align-content: center;
    }

    .main { display: flex; flex-direction: column; min-width: 0; }

    /* --- hàng trợ giúp --- */
    .lifelines { display: flex; gap: 12px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }

    .ll {
      position: relative;
      width: 78px; height: 56px;
      border: 0; padding: 0; cursor: pointer;
      background: linear-gradient(180deg, var(--blue-500), #12306e);
      clip-path: var(--hex-sm);
      display: grid; place-items: center;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, .5));
      transition: filter .15s ease, transform .08s ease;
    }
    .ll::before {
      content: ''; position: absolute; inset: 2px; clip-path: var(--hex-sm);
      background: var(--bong), linear-gradient(180deg, #0d2552, #061231);
    }
    .ll > * { position: relative; z-index: 1; }
    .ll:hover:not(:disabled) { filter: brightness(1.25); }
    .ll:active:not(:disabled) { transform: translateY(2px); }
    .ll:disabled { cursor: default; filter: grayscale(1) brightness(.45); }
    /* quyền đã dùng thì mờ đi nhưng vẫn phải nhìn rõ vạch gạch chéo đỏ */
    .ll.used, .ll.used:disabled { filter: none; opacity: .52; }

    .ll .ic { font-family: var(--fx-display); font-size: 19px; color: var(--amber-400); letter-spacing: .02em; }
    .ll .ic.sm { font-size: 24px; line-height: 1; }
    .ll .lb { font-size: 8.5px; color: var(--cream-dim); margin-top: 2px; letter-spacing: .03em; text-transform: uppercase; }

    /* quyền chưa tới lúc dùng: mờ hẳn, không gạch chéo đỏ như quyền đã xài */
    .ll.khoa { filter: grayscale(.9) brightness(.52); }
    .ll.khoa .lb { color: rgba(159, 180, 216, .85); letter-spacing: .02em; }

    /* vừa mở khoá thì loé lên một nhịp cho người chơi để ý */
    .ll.vuamo { animation: vuamo 1.1s ease-out 2; }
    @keyframes vuamo {
      0%, 100% { filter: none; }
      45% { filter: brightness(1.75) drop-shadow(0 0 16px rgba(255, 184, 61, .85)); }
    }

    .ll.used::after {
      content: ''; position: absolute; z-index: 2; left: 10%; right: 10%; top: 50%;
      height: 3px; background: var(--red-500); transform: rotate(-14deg);
      box-shadow: 0 0 10px rgba(209, 33, 33, .9);
    }

    /* --- khung giữa: nơi hiện kết quả trợ giúp --- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 190px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }

    /* logo chìm rất mờ cho khoảng giữa đỡ trống; thẻ trợ giúp hiện lên thì
       nằm đè lên trên nó */
    .stage::before {
      content: ''; position: absolute; z-index: 0;
      width: 168px; height: 168px;
      background: url("logo.svg") center / contain no-repeat;
      opacity: .07;
      animation: xoaycham 90s linear infinite;
      pointer-events: none;
    }
    @keyframes xoaycham { to { transform: rotate(360deg); } }

    .host {
      position: relative; z-index: 1;
      text-align: center;
      color: var(--cream-dim);
      font-size: 14px;
      line-height: 1.7;
      max-width: 52ch;
      padding: 0 10px;
    }
    .host b { color: var(--amber-400); font-weight: 700; }

    .card {
      position: relative; z-index: 1;
      width: min(560px, 100%);
      background: linear-gradient(180deg, rgba(10, 32, 76, .96), rgba(4, 14, 38, .96));
      border: 1.5px solid rgba(90, 166, 255, .42);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
    }
    .card h3 {
      margin: 0 0 14px; font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
      color: var(--amber-400); font-weight: 700;
    }

    /* biểu đồ khán giả */
    .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: end; height: 160px; }
    .bar-col { display: grid; grid-template-rows: 1fr auto auto; gap: 6px; height: 100%; }
    .bar-wrap { display: flex; align-items: flex-end; }
    .bar {
      width: 100%; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--blue-400), var(--blue-600));
      box-shadow: 0 0 14px rgba(90, 166, 255, .4);
      height: 0; transition: height .9s cubic-bezier(.22, 1, .36, 1);
    }
    .bar-pct { text-align: center; font-weight: 700; font-size: 14px; color: var(--cream); }
    .bar-key { text-align: center; font-weight: 700; font-size: 13px; color: var(--amber-400); }

    /* tổ tư vấn / điện thoại */
    .people { display: grid; gap: 10px; }
    .person {
      display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center;
      background: rgba(90, 166, 255, .07);
      border: 1px solid rgba(90, 166, 255, .2);
      border-radius: 10px; padding: 10px 12px;
      opacity: 0; transform: translateY(6px);
      animation: pop .45s cubic-bezier(.22, 1, .36, 1) forwards;
    }
    @keyframes pop { to { opacity: 1; transform: none; } }
    .person .av {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(180deg, var(--blue-500), #12306e); font-size: 15px;
    }
    .person .nm { font-size: 13.5px; line-height: 1.5; color: var(--cream-dim); }
    .person .nm b { color: var(--cream); font-weight: 600; }
    /* chỉ TÊN người tư vấn mới xuống dòng riêng, chữ cái trong câu nói thì không */
    .person .nm b.who { display: block; margin-bottom: 1px; }
    .person .pk {
      font-family: var(--fx-display); font-size: 22px; color: var(--amber-400); min-width: 22px; text-align: center;
    }

    .clock {
      font-family: var(--fx-display); font-size: 54px; text-align: center; color: var(--amber-400);
      line-height: 1; margin: 6px 0 2px; font-variant-numeric: tabular-nums;
    }
    .clock.hot { color: var(--red-500); animation: pulse .5s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.09); } }

    /* --- hộp câu hỏi --- */
    .qbox {
      position: relative; padding: 2px; clip-path: var(--hex);
      background: linear-gradient(180deg, var(--blue-500), #12306e);
      filter: drop-shadow(0 14px 36px rgba(27, 86, 196, .45));
    }
    .qbox::before {
      content: ''; position: absolute; inset: 2px; clip-path: var(--hex);
      background: var(--bong), linear-gradient(180deg, #0b2252 0%, #050f2c 100%);
    }
    .qbox .inner {
      position: relative; z-index: 1;
      min-height: 86px; display: grid; place-items: center;
      padding: 18px clamp(26px, 5vw, 56px);
      text-align: center;
      font-size: clamp(15px, 2.1vw, 20px);
      font-weight: 500;
      line-height: 1.5;
      text-wrap: balance;
    }

    /* --- bốn phương án --- */
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 14px; }

    .ans {
      position: relative;
      border: 0; padding: 2px; cursor: pointer;
      clip-path: var(--hex);
      background: linear-gradient(180deg, var(--blue-500), #12306e);
      font: inherit; color: inherit; text-align: left;
      filter: drop-shadow(0 7px 18px rgba(0, 0, 0, .5));
      transition: transform .08s ease, filter .15s ease, opacity .3s ease;
    }
    .ans::before {
      content: ''; position: absolute; inset: 2px; clip-path: var(--hex);
      background: var(--bong), linear-gradient(180deg, #0b2252 0%, #050f2c 100%);
      transition: background .25s ease;
    }
    .ans .row {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center;
      min-height: 54px; padding: 10px 22px;
    }
    /* rê chuột vào thì một vệt sáng lướt chéo qua mặt khối */
    .ans .row::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(104deg, transparent 36%, rgba(255, 255, 255, .16) 50%, transparent 64%);
      transform: translateX(-115%);
      transition: transform .62s cubic-bezier(.3, 0, .2, 1);
    }
    .ans:hover:not(:disabled):not(.gone) .row::after { transform: translateX(115%); }

    .ans .k { font-family: var(--fx-display); font-size: 20px; color: var(--amber-400); transition: color .25s ease; }
    .ans .t { font-size: clamp(13.5px, 1.7vw, 16px); line-height: 1.35; font-weight: 500; }

    .ans:hover:not(:disabled):not(.gone) { filter: brightness(1.35); }
    .ans:active:not(:disabled):not(.gone) { transform: translateY(2px); }
    .ans:disabled { cursor: default; }

    .ans.gone { opacity: 0; pointer-events: none; }

    .ans.sel { background: linear-gradient(180deg, #ffd988, var(--amber-600)); }
    .ans.sel::before { background: var(--bong), linear-gradient(180deg, var(--amber-400) 0%, var(--amber-500) 100%); }
    .ans.sel .k, .ans.sel .t { color: #1a0f00; }

    .ans.ok { background: linear-gradient(180deg, var(--green-400), #0b6b2d); }
    .ans.ok::before { background: var(--bong), linear-gradient(180deg, var(--green-500) 0%, #0d7a35 100%); }
    .ans.ok .k, .ans.ok .t { color: #04140a; }

    .ans.bad { background: linear-gradient(180deg, #ff6b6b, #7a0d0d); }
    .ans.bad::before { background: var(--bong), linear-gradient(180deg, var(--red-500) 0%, #8c1111 100%); }
    .ans.bad .k, .ans.bad .t { color: #fff0f0; }

    .ans.blink { animation: blink .42s steps(1) 6; }
    @keyframes blink { 50% { filter: brightness(.35); } }

    .ans.hint { box-shadow: 0 0 0 0 transparent; }
    .ans.hint::after {
      content: ''; position: absolute; z-index: 2; inset: 2px; clip-path: var(--hex);
      box-shadow: inset 0 0 0 2px var(--amber-400);
      animation: hintpulse 1.1s ease-in-out infinite;
    }
    @keyframes hintpulse { 50% { opacity: .25; } }

    /* --- thanh dưới --- */
    /* Thang tiền bên phải đã nói hết: vạch vàng đặc là tiền đã có, vạch nhấp
       nháy là câu đang chơi. Không cần viết thêm con số nào ở đây. */
    .bottom { display: flex; justify-content: center; margin-top: 18px; }

    /* ===== Màn chào: nền tím và logo tròn =============================== */

    .introbg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(900px 640px at 18% 14%, #b06ae0, transparent 62%),
        radial-gradient(820px 600px at 88% 28%, #8b3fd0, transparent 60%),
        radial-gradient(760px 580px at 58% 104%, #6a23b0, transparent 62%),
        linear-gradient(162deg, #5b1aa8 0%, #3b1070 54%, #220744 100%);
    }

    .introbg::after {
      /* mấy vệt sáng loang như phông trường quay */
      content: ''; position: absolute; inset: 0; opacity: .5;
      background:
        radial-gradient(420px 300px at 30% 70%, rgba(214, 150, 255, .5), transparent 70%),
        radial-gradient(360px 260px at 76% 62%, rgba(150, 90, 230, .45), transparent 70%);
      mix-blend-mode: screen;
    }

    .mark {
      display: block;
      width: min(78vmin, 470px);
      margin: 0 auto;
      filter: drop-shadow(0 26px 64px rgba(0, 0, 0, .55));
    }

    /* chữ chạy vòng quanh vành ngoài */
    .vong {
      font-family: var(--fx-body);
      font-weight: 700;
      font-size: 27px;
      letter-spacing: 7px;
    }

    /* chữ lớn nằm giữa logo */
    .giua {
      font-family: var(--fx-display);
      font-size: 64px;
      fill: url(#gChu);
      stroke: #0a1030;
      stroke-width: 2.5;
      paint-order: stroke;
      letter-spacing: 1px;
    }

    /* ===== Đồng hồ đếm ngược ============================================ */

    .timer {
      position: relative; flex: 0 0 auto;
      width: 58px; height: 58px;
      display: grid; place-items: center;
      margin-right: 6px;
    }
    .timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer circle { fill: none; stroke-width: 4; stroke-linecap: round; }
    .t-bg { stroke: rgba(90, 166, 255, .22); }
    .t-fg {
      stroke: var(--amber-400);
      stroke-dasharray: 157.08;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke .3s ease;
    }
    .timer span {
      position: relative;
      font-family: var(--fx-display); font-size: 22px; color: var(--cream);
      font-variant-numeric: tabular-nums;
    }
    .timer.hot .t-fg { stroke: var(--red-500); }
    .timer.hot span { color: var(--red-500); }
    .timer.hot { animation: pulse .6s infinite alternate; }
    /* đang dùng trợ giúp thì đồng hồ dừng, làm mờ cho thấy rõ là đã dừng */
    .timer.nghi { opacity: .4; }
    .timer.nghi .t-fg { stroke: var(--cream-dim); }

    /* ===== Thang tiền ==================================================== */

    .ladder {
      position: relative;
      align-self: start;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .05), transparent 30%),
        linear-gradient(180deg, rgba(10, 32, 76, .82), rgba(3, 10, 30, .82));
      border: 1px solid rgba(90, 166, 255, .26);
      border-radius: 14px;
      padding: 13px 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .ladder::before, .ladder::after {
      content: ''; position: absolute; left: 16px; right: 16px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 184, 61, .5), transparent);
    }
    .ladder::before { top: 5px; }
    .ladder::after { bottom: 5px; }
    .lv {
      position: relative;
      display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 8px;
      padding: 5px 11px; border-radius: 999px;
      font-size: 13.5px; color: var(--amber-400); font-weight: 500;
      transition: background .3s ease, color .3s ease, box-shadow .3s ease;
    }
    .lv .n { color: var(--cream-dim); font-size: 12px; text-align: right; }
    .lv .v { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

    /* ba mốc 5, 10, 15: chữ trắng và một mảng sáng nhạt loang từ trái */
    .lv.moc {
      color: #fff; font-weight: 700;
      background: linear-gradient(90deg, rgba(255, 255, 255, .085), transparent 62%);
    }

    /* các câu đã qua từ lâu: lùi hẳn về sau */
    .lv.done { color: rgba(159, 180, 216, .42); }
    .lv.done .n { color: rgba(159, 180, 216, .26); }

    /* câu vừa trả lời đúng — đây là số tiền đang có */
    .lv.won {
      background: linear-gradient(90deg, var(--amber-500), var(--amber-400));
      color: #1a0f00; font-weight: 700;
      box-shadow: 0 0 24px rgba(255, 184, 61, .5), inset 0 1px 0 rgba(255, 255, 255, .55);
    }
    .lv.won .n { color: rgba(26, 15, 0, .68); }

    /* câu đang chơi — viền nhấp nháy, chưa phải tiền của mình */
    .lv.now {
      color: #fff; font-weight: 700;
      animation: nhipvach 1.6s ease-in-out infinite;
    }
    .lv.now .n { color: rgba(255, 255, 255, .6); }

    @keyframes nhipvach {
      0%, 100% {
        background: rgba(255, 184, 61, .13);
        box-shadow: inset 0 0 0 1.5px rgba(255, 184, 61, .95), 0 0 18px rgba(255, 184, 61, .3);
      }
      50% {
        background: rgba(255, 184, 61, .03);
        box-shadow: inset 0 0 0 1.5px rgba(255, 184, 61, .25), 0 0 4px rgba(255, 184, 61, .06);
      }
    }

    /* ===== Màn hình kết thúc ============================================= */

    .end-sum {
      font-family: var(--fx-display);
      font-size: clamp(38px, 9vw, 76px);
      color: var(--amber-400);
      margin: 10px 0 0; line-height: 1;
      filter: drop-shadow(0 8px 24px rgba(255, 184, 61, .3));
    }
    .end-note { color: var(--cream-dim); margin-top: 14px; font-size: 15px; line-height: 1.7; max-width: 44ch; }

    /* ===== Góc trên: bật tắt tiếng, thoát ================================ */

    .topbar {
      position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 30;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
      max-width: calc(100vw - 24px);
    }
    .mini {
      border: 1px solid rgba(90, 166, 255, .35);
      background: rgba(4, 16, 43, .8);
      color: var(--cream-dim);
      font: 600 12px var(--fx-body);
      border-radius: 999px; padding: 7px 13px; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .mini:hover { color: var(--cream); border-color: rgba(90, 166, 255, .7); }
    .mini.tat { opacity: .6; }

    @media (max-width: 620px) {
      .mini { padding: 6px 10px; font-size: 11px; }
    }

    /* ===== Điện thoại và máy tính bảng =================================== */

    @media (max-width: 920px) {
      #s-play { grid-template-columns: 1fr; padding: 52px 14px 22px; align-content: start; }
      .ladder {
        order: -1;
        display: flex; flex-direction: row-reverse; justify-content: flex-end;
        gap: 6px; overflow-x: auto; padding: 8px;
        scrollbar-width: none;
      }
      .ladder::-webkit-scrollbar { display: none; }
      .lv { grid-template-columns: auto; padding: 6px 12px; flex: 0 0 auto; font-size: 12.5px; }
      .lv .n { display: none; }
      .stage { min-height: 150px; }
    }

    @media (max-width: 620px) {
      .answers { grid-template-columns: 1fr; gap: 9px; }
      .ans .row { min-height: 48px; padding: 9px 18px; }
      /* đồng hồ và bốn quyền trợ giúp phải vừa đúng một hàng trên điện thoại */
      .ll { width: 62px; height: 46px; }
      .ll .ic { font-size: 16px; }
      .ll .ic.sm { font-size: 20px; }
      .ll .lb { font-size: 7.5px; }
      .lifelines { gap: 6px; flex-wrap: nowrap; }
      .timer { width: 46px; height: 46px; margin-right: 2px; }
      .timer span { font-size: 17px; }
      .timer circle { stroke-width: 5; }
      .stage { min-height: 108px; }
      .qbox .inner { padding: 15px 24px; min-height: 76px; }
      .bars { height: 120px; gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <!-- ===== Sẵn sàng chưa ================================================ -->
  <section class="screen" id="s-ready">
    <div>
      <h1 class="logo" style="font-size:clamp(28px,6.5vw,56px)">Bạn đã sẵn sàng<br>chơi với chúng tôi chưa?</h1>
      <div class="btn-row">
        <button class="btn" id="btn-ready" type="button">Tôi đã sẵn sàng</button>
      </div>
    </div>
  </section>

  <!-- ===== Màn hình chơi ================================================ -->
  <section class="screen" id="s-play">
    <div class="main">
      <div class="lifelines" id="lifelines">
        <div class="timer" id="timer" hidden title="Thời gian còn lại cho câu này">
          <svg viewBox="0 0 60 60" aria-hidden="true">
            <circle class="t-bg" cx="30" cy="30" r="25"></circle>
            <circle class="t-fg" cx="30" cy="30" r="25"></circle>
          </svg>
          <span id="timer-n">30</span>
        </div>
        <button class="ll" id="ll-5050" type="button" title="50:50 — loại bỏ hai phương án sai">
          <span class="ic">50:50</span><span class="lb">Năm mươi</span>
        </button>
        <button class="ll" id="ll-dt" type="button" title="Gọi điện thoại cho người thân">
          <span class="ic sm">&#9742;</span><span class="lb">Điện thoại</span>
        </button>
        <button class="ll" id="ll-kg" type="button" title="Hỏi ý kiến khán giả trong trường quay">
          <span class="ic sm">&#9823;&#9823;</span><span class="lb">Khán giả</span>
        </button>
        <button class="ll khoa" id="ll-tv" type="button"
          title="Tư vấn tại chỗ — chỉ có từ câu số 6">
          <span class="ic sm">&#9734;</span><span class="lb">Từ câu 6</span>
        </button>
      </div>

      <div class="stage" id="stage">
        <p class="host" id="host"></p>
      </div>

      <div class="qbox">
        <div class="inner" id="qtext"></div>
      </div>

      <div class="answers" id="answers">
        <button class="ans" data-i="0" type="button"><span class="row"><span class="k">A:</span><span class="t"></span></span></button>
        <button class="ans" data-i="1" type="button"><span class="row"><span class="k">B:</span><span class="t"></span></span></button>
        <button class="ans" data-i="2" type="button"><span class="row"><span class="k">C:</span><span class="t"></span></span></button>
        <button class="ans" data-i="3" type="button"><span class="row"><span class="k">D:</span><span class="t"></span></span></button>
      </div>

      <div class="bottom">
        <button class="btn ghost" id="btn-stop" type="button">Dừng cuộc chơi</button>
      </div>
    </div>

    <aside class="ladder" id="ladder"></aside>
  </section>

  <!-- ===== Kết thúc ===================================================== -->
  <section class="screen" id="s-end">
    <div>
      <p class="sub" id="end-title" style="margin:0;font-size:17px;font-weight:600;color:var(--cream)"></p>
      <h2 class="end-sum" id="end-sum"></h2>
      <p class="end-note" id="end-note"></p>
      <div class="btn-row">
        <button class="btn" id="btn-again" type="button">Chơi ván mới</button>
      </div>
    </div>
  </section>
